# Builds the documentation site with MkDocs and publishes it to GitHub Pages.
#
# Every run builds the site, which catches broken pages and links; the run's
# "docs-site" artifact holds the result.
#
# Publishing is off for now. To turn it on, set the repository variable
# DOCS_PUBLISH to "true" (Settings > Secrets and variables > Actions >
# Variables); the site then publishes from main. GitHub Pages also has to be
# available: on a free organization it only publishes public repositories.
name: Docs

on:
  push:
    branches: [main, biped_example]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push replaces an older run on the same branch only; a run on one
# branch never cancels another's.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      - name: Keep the built site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site
      - name: Check whether to publish
        id: pages
        run: |
          if [ "${{ vars.DOCS_PUBLISH }}" = "true" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Docs built, not published::The site was built (see the docs-site artifact). It publishes from main when the DOCS_PUBLISH repository variable is true."
          fi
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    # One deploy at a time, and none cut off halfway.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
