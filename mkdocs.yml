site_name: RigExec for Maya
site_description: Animate RigExec rigs in Maya 2027.
site_url: https://usdcharacter.github.io/usdRig_maya/
repo_url: https://github.com/usdCharacter/usdRig_maya
repo_name: usdRig_maya
edit_uri: ""
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.keys

nav:
  - Home: index.md
  - Getting started:
      - Install and build: install.md
      - "Tutorial: the biped": biped-example.md
  - Using the plug-in:
      - Loading a rig: loading.md
      - Animating: animating.md
      - Picker: picker.md
      - Hover picker: hover-picker.md
      - IK/FK and space switches: switching.md
      - Playback: playback.md
  - Reference:
      - How it works: how-it-works.md
      - Commands and nodes: reference.md
      - Python: python.md
      - Environment variables: environment.md
      - Limits: limits.md
      - Troubleshooting: troubleshooting.md
  - Maya ASCII translator: usdmayarig.md
